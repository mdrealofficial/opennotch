name: Release Build

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.0"

      - name: Build Release Binary
        run: |
          swift build -c release
          mkdir -p build/release/OpenNotch.app/Contents/MacOS
          mkdir -p build/release/OpenNotch.app/Contents/Resources
          cp .build/release/OpenNotch build/release/OpenNotch.app/Contents/MacOS/
          cp Resources/AppIcon.icns build/release/OpenNotch.app/Contents/Resources/ 2>/dev/null || true
          cp build/OpenNotch.app/Contents/Info.plist build/release/OpenNotch.app/Contents/ 2>/dev/null || true
          cd build/release
          zip -r OpenNotch-v1.1.0-macOS.zip OpenNotch.app

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: "OpenNotch ${{ github.ref_name }}"
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            build/release/OpenNotch-v1.1.0-macOS.zip
